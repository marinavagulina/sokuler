# Сборка и публикация сайта на GitHub Pages.
# Триггер: пуш в main (или ручной запуск из вкладки Actions).
# Публикует артефакт dist через официальные actions GitHub.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Афиша Сергея живёт в Google-таблице; пересобираем сайт ежечасно,
  # чтобы новые концерты появлялись без пушей в репозиторий.
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно собираем только один деплой; не отменяем промежуточные,
# чтобы очередь обновлений сохраняла порядок.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # URL Google-таблицы с афишей (хранится в секретах репозитория).
      # Если секрет не задан, сайт собирается с заглушкой афиши.
      - name: Build with Astro
        run: npm run build
        env:
          CONCERTS_SHEET_URL: ${{ secrets.CONCERTS_SHEET_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
