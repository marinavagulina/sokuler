context: |
  Гибридный режим работы (согласовано с Мариной, 08.11.2026):
  - OpenSpec — только для КРУПНЫХ изменений: новые подсистемы и разделы,
    где ошибка в требованиях дорога (каталог уроков, плеер, формы записи,
    кабинет ученика, структура разделов).
  - Мелочи (тексты, отступы, цвета-поправки, пункты меню) — фиксировать
    НЕ в спеках: делаем напрямую и коммитим; главный документ проекта —
    «Сайт — концепция и ТЗ.md» (D:\Marina\Work\Maksimov-sokuler\).
  - В спеках фиксируются: как сайт работает (поведение, сценарии) и
    базовые настройки (палитра, типографика, структура) — но не пиксели
    и не формулировки-плейсхолдеры.
  - Артефакты держать короткими: proposal ≤ 1 страницы, требования без
    технической реализации (она в design.md).
  - ПРАВИЛО КОММИТОВ: ничего не коммитить без явного одобрения Марины,
    посмотревшей изменения. Сначала показать результат (страницей/списком
    файлов), потом commit по её «ок».
  - OpenSpec заполнять ПО ХОДУ РАБОТЫ, без напоминаний: tasks.md отмечать
    сразу вместе с правками, ключевые решения — короткими записями
    (отклонения, договорённости) в tasks.md/design.md того же change.

